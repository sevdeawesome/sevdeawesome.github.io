<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascension — Flag Figure A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rubik', sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 16px 18px 14px;
            user-select: none;
            overflow: hidden;
        }

        #fig {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        #sky-canvas {
            display: block;
            width: 100%;
        }

        .fig-source {
            font-size: 0.63rem;
            color: rgba(255,255,255,0.22);
            letter-spacing: 0.3px;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
<div id="fig">
    <canvas id="sky-canvas" role="img"
        aria-label="A small intact American flag low in the frame under a vast night sky. One by one, stars rise from the flag's canton, leaving faint light trails, and join a growing field of hundreds of stars overhead — the flag seeding the sky."></canvas>
    <div class="fig-source">signal: us_1776 &nbsp;·&nbsp; integrity holding &nbsp;·&nbsp; trajectory nominal &nbsp;·&nbsp; destination: everywhere</div>
</div>

<script>
(function () {
'use strict';

const canvas = document.getElementById('sky-canvas');
const ctx = canvas.getContext('2d');
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── Palette (style.md) ────────────────────────────────────────────────────────
const BG_BOTTOM = '#1a1a1a';
const BG_TOP    = '#121218';   // deep space, only slightly darker than base
const CORAL     = '255,107,107';
const GOLD      = '255,215,0';
const WHITE     = '255,255,255';
const NAVY      = '#252f4d';   // muted canton navy
const MAROON    = '#7d2530';   // muted stripe red

// ── Deterministic RNG (stable sky across resizes) ─────────────────────────────
function mulberry32(seed) {
    return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const smoothstep = (e0, e1, x) => {
    const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
};

// ── Geometry / state ──────────────────────────────────────────────────────────
let W, H, dpr;              // device-pixel dimensions
let bgLayer = null;         // offscreen: gradient + milky way + horizon glow
let bgStars = [];           // parallax field   {x,y,r,a,twA,twS,twP,drift}
let settled = [];           // risen stars      {x,y,r,a,gold,twA,twS,twP}
let risers  = [];           // in flight        {x0,y0,xT,yT,dur,t0,swayAmp,swayPh,swayTurns,gold}
let cantonStars = [];       // rel positions of the flag's 50 stars
let flagRect = null;        // {x,y,w,h} rel

const MAX_SETTLED = 300;

// Flag layout (relative units, 0..1 of canvas)
const FLAG = { x: 0.10, w: 0.285, bottomPad: 0.055 };

function computeFlag() {
    const fw = FLAG.w;
    const fh = fw * 0.526 * (W / H);          // keep true flag aspect in rel space
    const fx = FLAG.x;
    const fy = 1 - FLAG.bottomPad - fh;
    flagRect = { x: fx, y: fy, w: fw, h: fh };

    // 50 stars: 9 rows alternating 6 / 5
    cantonStars = [];
    const cw = fw * 0.40, ch = fh * (7 / 13);
    for (let r = 0; r < 9; r++) {
        const n = (r % 2 === 0) ? 6 : 5;
        for (let c = 0; c < n; c++) {
            cantonStars.push({
                x: fx + cw * ((c + 1) / (n + 1)),
                y: fy + ch * ((r + 1) / 10)
            });
        }
    }
}

// ── Background prerender ──────────────────────────────────────────────────────
function buildBackground() {
    bgLayer = document.createElement('canvas');
    bgLayer.width = W; bgLayer.height = H;
    const b = bgLayer.getContext('2d');
    const rnd = mulberry32(20260704);

    // deep-space vertical gradient
    const g = b.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, BG_TOP);
    g.addColorStop(0.75, '#17171c');
    g.addColorStop(1, BG_BOTTOM);
    b.fillStyle = g;
    b.fillRect(0, 0, W, H);

    // faint milky way — diagonal band, lower-left to upper-right
    for (let i = 0; i < 6; i++) {
        const t = rnd();
        const cx = W * (0.05 + t * 1.0);
        const cy = H * (0.52 - 0.36 * t) + (rnd() - 0.5) * H * 0.05;
        const rad = W * (0.06 + rnd() * 0.09);
        const blob = b.createRadialGradient(cx, cy, 0, cx, cy, rad);
        blob.addColorStop(0, 'rgba(' + WHITE + ',0.013)');
        blob.addColorStop(1, 'rgba(' + WHITE + ',0)');
        b.fillStyle = blob;
        b.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
    }
    for (let i = 0; i < 520; i++) {
        const t = rnd();
        const gauss = (rnd() + rnd() + rnd() - 1.5) / 1.5;
        const x = W * (-0.05 + t * 1.15);
        const y = H * (0.53 - 0.37 * t) + gauss * H * 0.065;
        if (y < 0 || y > H * 0.8) continue;
        b.fillStyle = 'rgba(' + WHITE + ',' + (0.012 + rnd() * 0.035).toFixed(3) + ')';
        const s = (0.4 + rnd() * 0.9) * dpr;
        b.fillRect(x, y, s, s);
    }

    // low coral horizon glow behind the flag — embers about to rise
    const hx = W * 0.24, hy = H * 1.02, hr = W * 0.55;
    const hg = b.createRadialGradient(hx, hy, 0, hx, hy, hr);
    hg.addColorStop(0, 'rgba(' + CORAL + ',0.05)');
    hg.addColorStop(0.6, 'rgba(' + CORAL + ',0.018)');
    hg.addColorStop(1, 'rgba(' + CORAL + ',0)');
    b.fillStyle = hg;
    b.fillRect(0, 0, W, H);
}

// ── Star fields ───────────────────────────────────────────────────────────────
function buildBgStars() {
    bgStars = [];
    const rnd = mulberry32(1776);
    const layers = [
        { n: 130, rMin: 0.35, rMax: 0.8, aMax: 0.28, drift: 0.0007 },  // far
        { n: 90,  rMin: 0.5,  rMax: 1.1, aMax: 0.42, drift: 0.0015 },  // mid
        { n: 45,  rMin: 0.7,  rMax: 1.5, aMax: 0.60, drift: 0.0028 }   // near
    ];
    for (const L of layers) {
        for (let i = 0; i < L.n; i++) {
            const y = Math.pow(rnd(), 0.72) * 0.88;      // denser toward the top
            bgStars.push({
                x: rnd(),
                y: y,
                r: lerp(L.rMin, L.rMax, rnd()),
                a: (0.10 + rnd() * L.aMax) * (1 - smoothstep(0.62, 0.88, y) * 0.65),
                twA: 0.25 + rnd() * 0.45,
                twS: 0.4 + rnd() * 1.1,
                twP: rnd() * Math.PI * 2,
                drift: L.drift
            });
        }
    }
}

function makeSettled(rnd, x, y, gold) {
    return {
        x: x, y: y,
        r: 0.7 + rnd() * 0.9,
        a: 0.45 + rnd() * 0.45,
        gold: gold,
        twA: 0.15 + rnd() * 0.35,
        twS: 0.3 + rnd() * 0.9,
        twP: rnd() * Math.PI * 2
    };
}

function makeRiser(rnd, now, progress) {
    const origin = cantonStars[Math.floor(rnd() * cantonStars.length)];
    const xT = Math.min(0.95, Math.max(0.05, origin.x + (rnd() - 0.22) * 0.95));
    const yT = 0.035 + 0.56 * Math.pow(rnd(), 1.25);
    const dur = 13 + rnd() * 8;
    return {
        x0: origin.x, y0: origin.y,
        xT: xT, yT: yT,
        dur: dur,
        t0: now - dur * (progress || 0),
        swayAmp: 0.008 + rnd() * 0.018,
        swayPh: rnd() * Math.PI * 2,
        swayTurns: (2 + rnd() * 2.5) * Math.PI,
        gold: rnd() < 0.07
    };
}

function riserPos(rz, p) {
    const s = smooth(p);
    const swayEnv = Math.sin(Math.PI * Math.min(p * 1.15, 1));   // zero at launch & settle
    return {
        x: lerp(rz.x0, rz.xT, s) + rz.swayAmp * Math.sin(rz.swayPh + p * rz.swayTurns) * swayEnv,
        y: lerp(rz.y0, rz.yT, s)
    };
}

// Pre-seed the scene so it opens alive: sky already partly sown, a few in flight
function seedScene() {
    settled = [];
    risers = [];
    const rnd = mulberry32(50);
    const nSeed = REDUCED ? 140 : 85;
    for (let i = 0; i < nSeed; i++) {
        const y = 0.03 + 0.58 * Math.pow(rnd(), 1.25);
        settled.push(makeSettled(rnd, 0.05 + rnd() * 0.90, y, rnd() < 0.06));
    }
    const nFly = REDUCED ? 3 : 5;
    for (let i = 0; i < nFly; i++) {
        risers.push(makeRiser(rnd, 0, 0.12 + rnd() * 0.75));
    }
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawStar(x, y, r, alpha, gold) {
    const col = gold ? GOLD : WHITE;
    if (r > 1.0 || gold) {
        const gr = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
        gr.addColorStop(0, 'rgba(' + col + ',' + (alpha * 0.30).toFixed(3) + ')');
        gr.addColorStop(1, 'rgba(' + col + ',0)');
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(x, y, r * 5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.fillStyle = 'rgba(' + col + ',' + alpha.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
}

// the single brightest star in the sky — gold, with soft cross rays
function drawHeroStar(t) {
    const x = W * 0.775, y = H * 0.095;
    const pulse = REDUCED ? 1 : 0.88 + 0.12 * Math.sin(t * 0.7);
    const r = 1.9 * dpr * pulse;

    const gr = ctx.createRadialGradient(x, y, 0, x, y, r * 9);
    gr.addColorStop(0, 'rgba(' + GOLD + ',' + (0.28 * pulse).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(' + GOLD + ',0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(x, y, r * 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(' + GOLD + ',' + (0.30 * pulse).toFixed(3) + ')';
    ctx.lineWidth = 0.7 * dpr;
    const ray = 9 * dpr * pulse;
    ctx.beginPath();
    ctx.moveTo(x - ray, y); ctx.lineTo(x + ray, y);
    ctx.moveTo(x, y - ray); ctx.lineTo(x, y + ray);
    ctx.stroke();

    ctx.fillStyle = 'rgba(' + GOLD + ',' + (0.95 * pulse).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
}

function drawFlag(t) {
    const f = flagRect;
    const fx = f.x * W, fy = f.y * H, fw = f.w * W, fh = f.h * H;

    // pole
    ctx.strokeStyle = 'rgba(' + WHITE + ',0.16)';
    ctx.lineWidth = Math.max(1, 1.1 * dpr);
    ctx.beginPath();
    ctx.moveTo(fx, fy - fh * 0.14);
    ctx.lineTo(fx, H * (1 - FLAG.bottomPad * 0.25));
    ctx.stroke();

    // stripes — muted, quiet, intact
    const stripeH = fh / 13;
    for (let i = 0; i < 13; i++) {
        if (i % 2 === 0) {
            ctx.fillStyle = MAROON;
            ctx.globalAlpha = 0.72;
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.19;
        }
        ctx.fillRect(fx, fy + i * stripeH, fw, stripeH * 0.96);
    }
    ctx.globalAlpha = 1;

    // canton
    ctx.fillStyle = NAVY;
    ctx.globalAlpha = 0.96;
    ctx.fillRect(fx, fy, fw * 0.40, fh * (7 / 13));
    ctx.globalAlpha = 1;

    // 50 stars, softly breathing
    const sr = Math.max(0.8, fw * 0.0085);
    for (let i = 0; i < cantonStars.length; i++) {
        const s = cantonStars[i];
        const tw = REDUCED ? 1 : 0.86 + 0.14 * Math.sin(t * 0.8 + i * 1.7);
        ctx.fillStyle = 'rgba(' + WHITE + ',' + (0.82 * tw).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, sr, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawRiser(rz, now) {
    const p = Math.min(1, Math.max(0, (now - rz.t0) / rz.dur));
    const pos = riserPos(rz, p);
    const x = pos.x * W, y = pos.y * H;

    const fadeIn  = smoothstep(0, 0.07, p);
    const fadeOut = 1 - smoothstep(0.85, 0.99, p);
    const trailA = 0.34 * fadeIn * fadeOut;

    // trail — opposite the direction of travel, white cooling to coral
    if (trailA > 0.005) {
        const prev = riserPos(rz, Math.max(0, p - 0.05));
        let dx = prev.x * W - x, dy = prev.y * H - y;
        const len = Math.hypot(dx, dy) || 1;
        const trailLen = H * 0.075 * Math.sin(Math.PI * Math.min(p * 1.1, 1));
        dx = dx / len * trailLen; dy = dy / len * trailLen;

        const tg = ctx.createLinearGradient(x, y, x + dx, y + dy);
        tg.addColorStop(0, 'rgba(' + WHITE + ',' + trailA.toFixed(3) + ')');
        tg.addColorStop(0.35, 'rgba(' + CORAL + ',' + (trailA * 0.55).toFixed(3) + ')');
        tg.addColorStop(1, 'rgba(' + CORAL + ',0)');
        ctx.strokeStyle = tg;
        ctx.lineWidth = 1.1 * dpr;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + dx, y + dy);
        ctx.stroke();
    }

    // launch shimmer at the canton in the first moments
    if (p < 0.10) {
        const la = 0.10 * (1 - p / 0.10);
        const lg = ctx.createRadialGradient(rz.x0 * W, rz.y0 * H, 0, rz.x0 * W, rz.y0 * H, 8 * dpr);
        lg.addColorStop(0, 'rgba(' + CORAL + ',' + la.toFixed(3) + ')');
        lg.addColorStop(1, 'rgba(' + CORAL + ',0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.arc(rz.x0 * W, rz.y0 * H, 8 * dpr, 0, Math.PI * 2);
        ctx.fill();
    }

    // the rising star itself, shrinking gently into the distance
    const r = lerp(1.7, 1.0, smooth(p)) * dpr;
    drawStar(x, y, r, 0.92 * fadeIn, rz.gold);

    return p >= 1;
}

// ── Frame ─────────────────────────────────────────────────────────────────────
const liveRnd = mulberry32(Date.now() & 0xffff);
let nextSpawn = 1.2;

function renderFrame(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bgLayer, 0, 0);

    // parallax field, drifting upward like embers — barely
    for (const s of bgStars) {
        let y = s.y;
        if (!REDUCED) {
            y = s.y - t * s.drift;
            y = ((y % 0.9) + 0.9) % 0.9;
        }
        const tw = REDUCED ? 1 : 1 + s.twA * Math.sin(t * s.twS + s.twP);
        const a = Math.max(0, Math.min(1, s.a * tw));
        if (a < 0.01) continue;
        ctx.fillStyle = 'rgba(' + WHITE + ',' + a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(s.x * W, y * H, s.r * dpr, 0, Math.PI * 2);
        ctx.fill();
    }

    // risen constellation
    for (const s of settled) {
        const tw = REDUCED ? 1 : 1 + s.twA * Math.sin(t * s.twS + s.twP);
        drawStar(s.x * W, s.y * H, s.r * dpr, Math.max(0, Math.min(1, s.a * tw)), s.gold);
    }

    drawHeroStar(t);
    drawFlag(t);

    // stars in flight
    for (let i = risers.length - 1; i >= 0; i--) {
        if (drawRiser(risers[i], t)) {
            const rz = risers[i];
            settled.push(makeSettled(liveRnd, rz.xT, rz.yT, rz.gold));
            if (settled.length > MAX_SETTLED) settled.shift();
            risers.splice(i, 1);
        }
    }

    // patient, inevitable launches
    if (!REDUCED && t > nextSpawn) {
        risers.push(makeRiser(liveRnd, t, 0));
        nextSpawn = t + 1.7 + liveRnd() * 1.8;
    }
}

// ── Loop / init ───────────────────────────────────────────────────────────────
let animId = null, startT = null;

function animate(ts) {
    if (startT === null) startT = ts;
    renderFrame((ts - startT) / 1000);
    animId = requestAnimationFrame(animate);
}

function resize() {
    dpr = window.devicePixelRatio || 1;
    const cssW = canvas.parentElement.clientWidth;
    const cssH = Math.max(300, Math.round(cssW * 0.80));
    W = Math.round(cssW * dpr);
    H = Math.round(cssH * dpr);
    canvas.width = W;
    canvas.height = H;
    canvas.style.height = cssH + 'px';
    computeFlag();
    buildBackground();
    buildBgStars();
}

let seeded = false;
function start() {
    if (animId) cancelAnimationFrame(animId);
    resize();
    if (!seeded) { seedScene(); seeded = true; }
    if (REDUCED) {
        // one beautiful still: a sky already sown, three stars caught mid-ascent
        renderFrame(4.2);
    } else {
        startT = null;
        animId = requestAnimationFrame(animate);
    }
}

let resizeTimer;
window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(start, 80);
});

if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start);
} else {
    start();
}
})();
</script>
</body>
</html>
