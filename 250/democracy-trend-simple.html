<!DOCTYPE html>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rubik', sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 18px 20px 12px;
            user-select: none;
        }

        #chart-container { width: 100%; max-width: 700px; margin: 0 auto; }

        .chart-title {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #fff;
            margin-bottom: 3px;
        }
        .chart-subtitle {
            font-size: 0.73rem;
            color: rgba(255,255,255,0.42);
            margin-bottom: 12px;
            letter-spacing: 0.2px;
            line-height: 1.5;
        }
        .chart-subtitle a { color: rgba(255,135,135,0.55); text-decoration: none; }
        .chart-subtitle a:hover { color: #ff8787; }

        /* Legend used on narrow screens, where the right-edge labels would shrink to nothing */
        #legend {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 6px 14px;
            margin-bottom: 12px;
            font-size: 0.7rem;
        }
        #legend .legend-item { display: flex; align-items: center; gap: 7px; }
        #legend .swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; }

        svg { display: block; width: 100%; height: auto; overflow: visible; }

        .axis text {
            font-family: 'Rubik', sans-serif;
            font-size: 10.5px;
            fill: rgba(255,255,255,0.45);
        }
        .gridline { stroke: rgba(255,255,255,0.09); stroke-width: 1; }

        .series-label {
            font-family: 'Rubik', sans-serif;
            font-weight: 500;
            font-size: 11px;
        }
        .series-pct {
            font-family: 'Rubik', sans-serif;
            font-size: 10px;
            opacity: 0.8;
        }

// Stack order bottom → top (liberal democracies sit on the x-axis, like OWID's chart)
const SERIES = [
    { idx: 4, name: "Liberal democracies",    fill: "#4f89c9", label: "#7db1e8" },
    { idx: 3, name: "Electoral democracies",  fill: "#33507b", label: "#8aa6cc" },
    { idx: 2, name: "Electoral autocracies",  fill: "#8a4a52", label: "#cf9298" },
    { idx: 1, name: "Closed autocracies",     fill: "#75212c", label: "#c56b6b" }
];

// ─── LAYOUT ──────────────────────────────────────────────────────────────────
const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("chart");
const container = document.getElementById("chart-container");
const legend = document.getElementById("legend");

const yearMin = data[0][0];
const yearMax = data[data.length - 1][0];

// Two layouts: wide (labels on the right edge) and narrow (legend above the chart).
let VB_W, VB_H, margin, width, height, narrow;
function computeLayout() {
    narrow = (container.clientWidth || 700) < 540;
    if (narrow) {
        VB_W = 360; VB_H = 280;
        margin = { top: 8, right: 10, bottom: 24, left: 32 };
    } else {
        VB_W = 700; VB_H = 330;
        margin = { top: 10, right: 132, bottom: 26, left: 34 };
    }
    width = VB_W - margin.left - margin.right;
    height = VB_H - margin.top - margin.bottom;
}

function xScale(year) {
    return margin.left + ((year - yearMin) / (yearMax - yearMin)) * width;
}
function yScale(pct) {
    return margin.top + height - (pct / 100) * height;
}

function el(tag, attrs) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
}

// cumulative share from the bottom of the stack up to and including series s
function cumUpTo(row, s) {
    let sum = 0;
    for (let i = 0; i <= s; i++) sum += row[SERIES[i].idx];
    return sum;
}

function areaPath(s) {
    const top = data.map((d, i) => {
        const x = xScale(d[0]).toFixed(2);
        const y = yScale(cumUpTo(d, s)).toFixed(2);
        return (i === 0 ? "M" : "L") + x + "," + y;
    }).join(" ");
    const bottom = data.slice().reverse().map(d => {
        const x = xScale(d[0]).toFixed(2);
        const y = yScale(s === 0 ? 0 : cumUpTo(d, s - 1)).toFixed(2);
        return "L" + x + "," + y;
    }).join(" ");
    return top + " " + bottom + " Z";
}

function buildLegend() {
    const last = data[data.length - 1];
    legend.innerHTML = "";
    // top-of-stack first, so the legend reads in the same order as the bands
    SERIES.slice().reverse().forEach(series => {
        const item = document.createElement("div");
        item.className = "legend-item";
        const sw = document.createElement("span");
        sw.className = "swatch";
        sw.style.background = series.fill;
        const txt = document.createElement("span");
        txt.style.color = series.label;
        txt.textContent = series.name + " · " + last[series.idx].toFixed(0) + "%";
        item.appendChild(sw);
        item.appendChild(txt);
        legend.appendChild(item);
    });
}

function render() {
    computeLayout();
    svg.setAttribute("viewBox", "0 0 " + VB_W + " " + VB_H);
    legend.style.display = narrow ? "grid" : "none";
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // ── Stacked areas (bottom → top), separated by a hairline of background ──
    SERIES.forEach((series, s) => {
        svg.appendChild(el("path", {
            d: areaPath(s),
            fill: series.fill,
            stroke: "#1a1a1a",
            "stroke-width": 0.75
        }));
    });

    // ── Y gridlines + axis labels ──
    const axisG = el("g", { class: "axis" });
    [0, 25, 50, 75, 100].forEach(t => {
        const y = yScale(t);
        if (t > 0 && t < 100) {
            axisG.appendChild(el("line", {
                class: "gridline",
                x1: margin.left, x2: margin.left + width,
                y1: y, y2: y
            }));
        }
        const label = el("text", { x: margin.left - 10, y: y + 3.5, "text-anchor": "end" });
        label.textContent = t + "%";
        axisG.appendChild(label);
    });

    // ── X axis ──
    (narrow ? [1800, 1900, 2000] : [1800, 1850, 1900, 1950, 2000, 2025]).forEach(yr => {
        const label = el("text", {
            x: xScale(yr), y: margin.top + height + 18,
            "text-anchor": "middle"
        });
        label.textContent = yr;
        axisG.appendChild(label);
    });
    axisG.appendChild(el("line", {
        x1: margin.left, x2: margin.left + width,
        y1: margin.top + height, y2: margin.top + height,
        stroke: "rgba(255,255,255,0.13)"
    }));
    svg.appendChild(axisG);

    // ── Direct labels at each band's midpoint on the right edge (wide layout only) ──
    if (narrow) return;
    const last = data[data.length - 1];
    const xLabel = xScale(last[0]) + 12;
    const MIN_GAP = 28;
    const anchors = SERIES.map((series, s) => {
        const lo = s === 0 ? 0 : cumUpTo(last, s - 1);
        const hi = cumUpTo(last, s);
        return { series, value: last[series.idx], y: yScale((lo + hi) / 2) };
    });
    // top-down pass to keep label groups from overlapping when a band is thin
    anchors.sort((a, b) => a.y - b.y);
    for (let i = 1; i < anchors.length; i++) {
        if (anchors[i].y - anchors[i - 1].y < MIN_GAP) {
            anchors[i].y = anchors[i - 1].y + MIN_GAP;
        }
    }

    anchors.forEach(a => {
        const name = el("text", {
            class: "series-label",
            x: xLabel, y: a.y - 2, fill: a.series.label
        });
        name.textContent = a.series.name;
        const pct = el("text", {
            class: "series-pct",
            x: xLabel, y: a.y + 11, fill: a.series.label
        });
        pct.textContent = a.value.toFixed(0) + "% in " + yearMax;
        svg.appendChild(name);
        svg.appendChild(pct);
    });
}

buildLegend();
render();

let resizeTimer;
window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 100);
});
</script>
