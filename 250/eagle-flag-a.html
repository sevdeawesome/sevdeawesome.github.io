// ── palette (style.md + granted navy exception) ──
const BG       = '#1a1a1a';
const CORAL    = '#ff6b6b';
const CORAL_L  = '#ff8787';
const MAROON   = '#8b2635';
const MAROON_D = '#5c1a24';
const NAVY     = '#2e4057';
const NAVY_D   = '#24344d';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const stage  = document.getElementById('stage');
const tel    = document.getElementById('telemetry');
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, dpr = 1;
let flagDim = null, flagLit = null, scanOv = null, grainPat = null;
let passR = null, passW = null, passB = null;
const eagle = { img: null, iw: 377, ih: 403, dw: 0, dh: 0, dx: 0, dy: 0 };
let t0 = 0, telKey = -1;

// ── tiny utils ──
function hash(n) { const x = Math.sin(n * 127.1 + 13.7) * 43758.5453; return x - Math.floor(x); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { return t * t * (3 - 2 * t); }
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function easeInCubic(t) { return t * t * t; }
function mk(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
}
// smooth drifting noise, -1..1
function noiseV(t, s) { return Math.sin(t * 0.9 + s * 2.3) * 0.62 + Math.sin(t * 1.9 + s * 5.1) * 0.38; }

// ── prerendered layers ──

// The flag beneath: 13 stripes + canton + stars, as a muted print field.
// lit=0 → degraded working state; lit=1 → the "settled" plate shown during registration.
function buildFlag(lit) {
    const c = mk(W * dpr, H * dpr);
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    g.fillStyle = BG; g.fillRect(0, 0, W, H);

    const sh = H / 13;
    for (let i = 0; i < 13; i++) {
        if (i % 2 === 0) {
            g.fillStyle = lit ? MAROON : MAROON_D;
            g.globalAlpha = lit ? 0.95 : 0.8;
        } else {
            g.fillStyle = '#ffffff';
            g.globalAlpha = lit ? 0.13 : 0.065;
        }
        g.fillRect(0, i * sh, W, sh + 0.6);
    }
    g.globalAlpha = 1;

    // canton
    const cw = W * 0.42, ch = sh * 7;
    g.fillStyle = lit ? NAVY : NAVY_D;
    g.globalAlpha = lit ? 0.95 : 0.82;
    g.fillRect(0, 0, cw, ch);
    g.globalAlpha = 1;

    // stars — 9 staggered rows (6/5), a few dropped out when degraded
    const sz = Math.max(1.7, cw * 0.013);
    let sc = 0;
    for (let r = 0; r < 9; r++) {
        const n = (r % 2 === 0) ? 6 : 5;
        for (let s = 0; s < n; s++) {
            sc++;
            const x = cw * ((r % 2 === 0) ? (s + 0.5) / 6 : (s + 1) / 6);
            const y = ch * (r + 0.5) / 9;
            const dead = !lit && hash(sc * 3.7) < 0.14;
            g.globalAlpha = (lit ? 0.85 : 0.45) * (dead ? 0.25 : 1) * (0.8 + hash(sc * 1.9) * 0.2);
            g.fillStyle = '#ffffff';
            g.fillRect(x - sz / 2, y - sz / 2, sz, sz);
        }
    }
    g.globalAlpha = 1;

    // faint vertical dropout bands (ink starvation) — heavier when degraded
    const bands = lit ? 6 : 14;
    for (let i = 0; i < bands; i++) {
        g.fillStyle = 'rgba(26,26,26,' + (0.07 + hash(i * 9.1) * 0.14).toFixed(2) + ')';
        g.fillRect(hash(i * 4.3) * W, 0, 2 + hash(i * 6.7) * 13, H);
    }

    // vignette
    const vg = g.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, W * 0.72);
    vg.addColorStop(0, 'rgba(26,26,26,0)');
    vg.addColorStop(1, 'rgba(26,26,26,' + (lit ? 0.3 : 0.52) + ')');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
    return c;
}

// scanline field, laid over flag AND eagle so the whole image reads as one print
function buildScan() {
    const c = mk(W * dpr, H * dpr);
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    g.fillStyle = 'rgba(26,26,26,0.34)';
    for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1.15);
    return c;
}

function buildGrain() {
    const s = 144, c = mk(s, s), g = c.getContext('2d');
    const id = g.createImageData(s, s), d = id.data;
    for (let i = 0; i < d.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = (Math.random() * 42) | 0;
    }
    g.putImageData(id, 0, 0);
    return ctx.createPattern(c, 'repeat');
}

// one tinted print pass of the eagle silhouette
function buildPass(color) {
    const c = mk(eagle.dw * dpr, eagle.dh * dpr);
    const g = c.getContext('2d');
    g.drawImage(eagle.img, 0, 0, c.width, c.height);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, c.width, c.height);
    return c;
}

// ── layout / resize ──
function layout() {
    const w = stage.clientWidth || 720;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = w;
    H = Math.min(Math.round(w * 0.52), 350);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const s = (H * 0.82) / eagle.ih;
    eagle.dh = eagle.ih * s;
    eagle.dw = eagle.iw * s;
    eagle.dx = (W - eagle.dw) / 2;
    eagle.dy = (H - eagle.dh) / 2 - H * 0.01;

    flagDim = buildFlag(0);
    flagLit = buildFlag(1);
    scanOv = buildScan();
    grainPat = buildGrain();
    if (eagle.img) {
        passR = buildPass(CORAL);
        passW = buildPass('#ffffff');
        passB = buildPass(NAVY);
    }
}

// ── the press cycle: drift → stress → SNAP → lock → release ──
const CYC = { d1: 4.4, d2: 5.9, d3: 6.26, d4: 7.9, total: 9.0 };

function stateAt(t) {
    const ct = t % CYC.total;
    let drift, lock = 0, stress, tremor = 0, flash = 0, phase;
    if (ct < CYC.d1) {                       // plates wandering
        const k = ct / CYC.d1;
        drift = lerp(0.35, 1, smooth(k));
        stress = drift * 0.45;
        phase = 'drift';
    } else if (ct < CYC.d2) {                // stress climbing, tearing
        const k = (ct - CYC.d1) / (CYC.d2 - CYC.d1);
        drift = 1 + 0.45 * easeInCubic(k);
        stress = 0.45 + 0.55 * k;
        phase = 'stress';
    } else if (ct < CYC.d3) {                // the snap
        const k = (ct - CYC.d2) / (CYC.d3 - CYC.d2);
        const e = easeOutQuart(k);
        drift = 1.45 * (1 - e);
        lock = e;
        stress = 0.6 * (1 - e);
        phase = 'snap';
    } else if (ct < CYC.d4) {                // held registration — the payoff
        const lk = ct - CYC.d3;
        const lp = lk / (CYC.d4 - CYC.d3);
        lock = 1; drift = 0; stress = 0;
        flash = Math.exp(-lk * 4.5);
        if (lp > 0.55 && lp < 0.68) { tremor = 1; lock = 0.93; } // holding costs energy
        phase = 'lock';
    } else {                                 // grip fails, plates release
        const k = (ct - CYC.d4) / (CYC.total - CYC.d4);
        lock = 1 - smooth(k);
        drift = 0.35 * easeInCubic(k);
        stress = 0.2 * k;
        phase = 'release';
    }
    return { t, ct, drift, lock, stress, tremor, flash, phase };
}

// draw one tinted pass, optionally torn into horizontal bands
function drawPass(pc, ox, oy, alpha, tear, seed, tq) {
    ctx.globalAlpha = alpha;
    if (tear < 0.03) {
        ctx.drawImage(pc, eagle.dx + ox, eagle.dy + oy, eagle.dw, eagle.dh);
    } else {
        const bands = 4, sbh = pc.height / bands, bh = eagle.dh / bands;
        for (let i = 0; i < bands; i++) {
            const j = (hash(tq * 13.7 + i * 7.3 + seed) - 0.5) * 2 * tear * 9;
            ctx.drawImage(pc, 0, i * sbh, pc.width, sbh,
                eagle.dx + ox + j, eagle.dy + oy + i * bh, eagle.dw, bh);
        }
    }
    ctx.globalAlpha = 1;
}

function regMark(x, y, col, alpha, r) {
    ctx.strokeStyle = col;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.moveTo(x - r * 1.6, y); ctx.lineTo(x + r * 1.6, y);
    ctx.moveTo(x, y - r * 1.6); ctx.lineTo(x, y + r * 1.6);
    ctx.stroke();
    ctx.globalAlpha = 1;
}

let lastOff = { rx: 0, ry: 0, bx: 0, by: 0 };

function renderFrame(st) {
    const A = 13;
    // pass offsets: red and blue pull apart; white is the anchor, wobbling
    let rx = st.drift * A * noiseV(st.t, 1.0);
    let ry = st.drift * A * 0.45 * noiseV(st.t, 2.0);
    let bx = -rx * 0.85 + st.drift * A * 0.35 * noiseV(st.t, 4.2);
    let by = -ry * 0.7 + st.drift * A * 0.3 * noiseV(st.t, 5.7);
    let wx = st.drift * A * 0.18 * noiseV(st.t, 7.1);
    let wy = st.drift * A * 0.15 * noiseV(st.t, 8.3);

    // jitter bursts under stress (quantized so a burst persists a few frames)
    const q = Math.floor(st.t * 13);
    if (hash(q * 3.1) < st.stress * 0.55) {
        rx += (hash(q * 7.7) - 0.5) * 11 * st.stress;
        bx += (hash(q * 9.3) - 0.5) * 11 * st.stress;
        ry += (hash(q * 5.9) - 0.5) * 5 * st.stress;
    }
    // held registration still trembles — energy spent to hold the line
    if (st.tremor) {
        const tq = Math.floor(st.t * 30);
        rx += (hash(tq * 1.7) - 0.5) * 2.4;
        bx += (hash(tq * 2.3) - 0.5) * 2.4;
    }
    const gy = Math.sin(st.t * 0.55) * 1.6 * (1 - st.lock); // slow breath
    lastOff = { rx, ry, bx, by };

    // ── flag field ──
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(flagDim, 0, 0, W, H);
    if (st.lock > 0.01) {
        ctx.globalAlpha = st.lock;
        ctx.drawImage(flagLit, 0, 0, W, H);   // flag settles & brightens under registration
        ctx.globalAlpha = 1;
    }
    // ambient flag flicker while unregistered
    const fl = hash(Math.floor(st.t * 9)) * (1 - st.lock);
    if (fl > 0.55) {
        ctx.fillStyle = 'rgba(26,26,26,' + (0.05 + st.stress * 0.05).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
    }
    // horizontal slice tears in the flag
    const tearN = Math.round(st.stress * 4);
    for (let i = 0; i < tearN; i++) {
        const tq = Math.floor(st.t * 8) + i * 97;
        const y = hash(tq * 1.3) * (H - 16);
        const hgt = 3 + hash(tq * 2.7) * 12;
        const dx2 = (hash(tq * 3.9) - 0.5) * 26 * st.stress;
        ctx.drawImage(flagDim, 0, y * dpr, W * dpr, hgt * dpr, dx2, y, W, hgt);
    }

    // ── the three print passes ──
    const tear = st.stress * st.stress;
    const tq = Math.floor(st.t * 11);
    ctx.globalCompositeOperation = 'screen';
    drawPass(passB, bx, by + gy, 0.96, tear, 11, tq);
    drawPass(passR, rx, ry + gy, 0.94, tear, 23, tq);
    drawPass(passW, wx * (1 - st.lock), wy * (1 - st.lock) + gy, 0.42 + 0.58 * st.lock, tear * 0.6, 37, tq);

    // bloom at the instant of registration — no shadowBlur, just a scaled ghost
    if (st.flash > 0.015) {
        ctx.globalAlpha = st.flash * 0.5;
        ctx.drawImage(passW, eagle.dx - eagle.dw * 0.015, eagle.dy - eagle.dh * 0.015,
            eagle.dw * 1.03, eagle.dh * 1.03);
        ctx.globalAlpha = st.flash * 0.07;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';

    // ── printer's registration marks at the eagle's corners ──
    const mr = 6.5;
    const mxs = [eagle.dx - 17, eagle.dx + eagle.dw + 17];
    const mys = [eagle.dy + 8, eagle.dy + eagle.dh - 8];
    const ca = 0.34 * (1 - st.lock) * clamp(st.drift + 0.3, 0, 1);
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
        const mx = mxs[i], my = mys[j];
        if (ca > 0.02) {
            regMark(mx + rx * 0.7, my + ry * 0.7, CORAL, ca, mr);
            regMark(mx + bx * 0.7, my + by * 0.7, NAVY, ca * 1.25, mr);
        }
        regMark(mx + wx * (1 - st.lock) * 0.7, my, '#ffffff', 0.12 + 0.7 * st.lock, mr);
    }

    // stray chroma streaks under stress
    if (st.stress > 0.1) {
        const sq = Math.floor(st.t * 6);
        if (hash(sq * 1.7) < st.stress * 0.6) {
            ctx.fillStyle = CORAL;
            ctx.globalAlpha = 0.1 + st.stress * 0.08;
            ctx.fillRect(0, hash(sq * 4.3) * H, W, 1.6);
        }
        if (hash(sq * 2.9) < st.stress * 0.45) {
            ctx.fillStyle = CORAL_L;
            ctx.globalAlpha = 0.06;
            ctx.fillRect(0, hash(sq * 6.1) * H, W, 1);
        }
        ctx.globalAlpha = 1;
    }

    // scanline field over everything (fades while registered — the print settles)
    ctx.globalAlpha = 1 - st.lock * 0.6;
    ctx.drawImage(scanOv, 0, 0, W, H);
    ctx.globalAlpha = 1;

    // film grain
    const ga = 0.05 + st.stress * 0.04 - st.lock * 0.025;
    if (ga > 0.01 && grainPat) {
        const gq = Math.floor(st.t * 24);
        const ox = Math.floor(hash(gq * 1.1) * 144), oy = Math.floor(hash(gq * 2.9) * 144);
        ctx.save();
        ctx.globalAlpha = ga;
        ctx.translate(-ox, -oy);
        ctx.fillStyle = grainPat;
        ctx.fillRect(0, 0, W + 144, H + 144);
        ctx.restore();
    }
}

// ── telemetry ──
function fmt(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1); }
function updateTel(st) {
    const sep = Math.hypot(lastOff.rx - lastOff.bx, lastOff.ry - lastOff.by);
    const driftPct = Math.round(clamp(sep / 24, 0, 1) * 100);
    let label;
    if (st.phase === 'drift')        label = '<span>passes separating…</span>';
    else if (st.phase === 'stress')  label = '<span>stress climbing — plates splitting</span>';
    else if (st.phase === 'snap')    label = '<span class="gold">SNAP</span>';
    else if (st.phase === 'lock')    label = st.tremor
        ? '<span class="gold">REGISTERED</span> <span class="dim">· holding — tremor</span>'
        : '<span class="gold">REGISTERED</span> <span class="dim">· holding</span>';
    else                             label = '<span>grip failing — releasing</span>';
    tel.innerHTML = 'plate: <span>us_1776</span> · reg drift <span>' + driftPct +
        '%</span> · R<span>' + fmt(lastOff.rx) + '</span> B<span>' + fmt(lastOff.bx) +
        '</span> px · ' + label;
}

// ── loop ──
function loop(now) {
    const t = (now - t0) / 1000 + 1.2;
    const st = stateAt(t);
    renderFrame(st);
    const k = Math.floor(t * 7);
    if (k !== telKey) { telKey = k; updateTel(st); }
    requestAnimationFrame(loop);
}

function renderStatic() {
    // one good frame: held registration with a whisper of misregistration at the fringes
    renderFrame({ t: 2.2, ct: 7, drift: 0.16, lock: 0.85, stress: 0.1, tremor: 0, flash: 0, phase: 'lock' });
    tel.innerHTML = 'plate: <span>us_1776</span> · motion reduced · registration held at <span class="gold">93%</span>';
}

// ── resize (debounced 80ms) ──
let rT = 0;
window.addEventListener('resize', function () {
    clearTimeout(rT);
    rT = setTimeout(function () {
        layout();
        if (REDUCED) renderStatic();
    }, 80);
});

// ── boot ──
const img = new Image();
Promise.all([
    document.fonts.ready,
    new Promise(function (res) { img.onload = res; img.src = EAGLE_SRC; })
]).then(function () {
    eagle.img = img;
    layout();
    if (REDUCED) { renderStatic(); return; }
    t0 = performance.now();
    requestAnimationFrame(loop);
});

})();
</script>
</body>
</html>
