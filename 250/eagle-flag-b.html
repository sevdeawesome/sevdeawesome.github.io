    <div class="telemetry" id="tel">signal: us_1776 &middot; acquiring carrier&hellip;</div>
    <div class="fig-source">the eagle was never painted on the flag — it is the part of the signal that refuses to decay.</div>

    // ── palette (style.md; navy exception granted for this figure) ──

    const MAROON      = [139, 38, 53];   // #8b2635
    const MAROON_DARK = [42, 13, 18];    // #2a0d12

    const CORAL_LIGHT = [255, 135, 135]; // #ff8787

    function mix(a, b, t) {

            Math.round(a[0] + (b[0] - a[0]) * t),
            Math.round(a[1] + (b[1] - a[1]) * t),
            Math.round(a[2] + (b[2] - a[2]) * t)

    function buildCells() {
        cells = [];
        cellW = W / COLS;
        cellH = H / ROWS;
        const gapX = cellW * 0.09, gapY = cellH * 0.09;
        const rw = cellW * 0.82, rh = cellH * 0.82;

                const t = col / (COLS - 1);              // 0 intact → 1 frayed
                const rnd = hash(sc), rnd2 = hash(sc + 7000);

                    base = mix(MAROON_DEEP, MAROON, ct * 0.6);
                    op = 0.96 - ct * 0.08;

                    op = parityRed ? 0.94 : 0.42;

                    op = parityRed ? (0.9 - l * 0.15) : (0.4 - l * 0.1);

                    op = Math.max(0.05, (parityRed ? 0.38 : 0.16) - l * 0.28);

                // the interference gain rises with local degradation: on the
                // intact left the eagle is a faint inversion you might miss;
                // in the frayed right it is the only thing still standing.
                const eff = 0.24 + 0.76 * t;
                const soft = mix(base, NAVY, 0.5 * eff);
                const strong = parityRed
                    ? mix(mix(base, NAVY_DEEP, 0.85 * eff), WHITE, 0.05 * eff)
                    : mix(mix(base, NAVY, 0.35 * eff), WHITE, 0.55 * eff);
                const wakeC = mix(base, NAVY, 0.3 * eff);

                cells.push({
                    x: col * cellW + gapX, y: row * cellH + gapY, w: rw, h: rh,
                    row: row, col: col,
                    cx: (col + 0.5) * cellW, cy: (row + 0.5) * cellH,
                    t: t, op: op,
                    eff: eff,
                    sBase: str(base), sSoft: str(soft), sStrong: str(strong), sWake: str(wakeC),
                    seed: rnd, seed2: rnd2,
                    fSp: 1.1 + rnd2 * 2.2,        // flicker speed
                    fPh: rnd * 6.283,             // flicker phase
                    dark: !parityRed && !inCanton

                const sz = Math.max(2.4, cellW * 0.24) + (rnd - 0.5) * 1.2;

                op = (c.op + (held - c.op) * c.eff) * fl;
                style = c.sStrong;
                if (afterglow > 0.25) op = Math.min(0.96, op + afterglow * 0.18 * c.eff);
            } else if (e > 0.16) {
                style = c.sSoft;
                const held = Math.min(0.9, Math.max(c.op, 0.4) + e * 0.3);
                op = (c.op + (held - c.op) * c.eff) * fl;
            } else if (wk > 0.06) {
                style = c.sWake;
                op = c.op * fl * (1 + wk * 0.3);
            } else {
                style = c.sBase;
                op = c.op * fl;

                if (burst && hash(c.seed2 * 577 + bStep) < 0.07) {
                    style = STR_WHITE; op = 0.28;

                    eagleAlpha(u - du, v), eagleAlpha(u + du, v),
                    eagleAlpha(u, v - dv), eagleAlpha(u, v + dv));

                    if (g > 0.55) { style = STR_WHITE; op = (0.30 + g * 0.34) * (0.35 + 0.65 * c.eff); }
                }

            if (c.row >= tearA && c.row < tearA + 2) x += tearOffA;
            else if (c.row >= tearB && c.row < tearB + 3) x += tearOffB;

            ctx.globalAlpha = op;
            ctx.fillStyle = style;
            ctx.fillRect(x, c.y, c.w, c.h);

        // the stars are disturbed where the shape passes
        for (let s = 0; s < stars.length; s++) {
            const st = stars[s];
            const u = (st.x - ex0) / ew, v = (st.y - ey0) / eh;

            ctx.globalAlpha = st.o * tw;

            ctx.fillRect(st.x - st.s / 2, st.y - st.s / 2, st.s, st.s);

            ctx.fillStyle = STR_WHITE;

            ctx.fillRect(0, y1, W, 1.5);
            ctx.fillRect(0, y2, W, 1);

    let rto = 0;
    window.addEventListener('resize', function () {
        clearTimeout(rto);
        rto = setTimeout(function () {
            resize();
            if (reduced) { for (let k = 0; k < 3; k++) draw(2.4 + k * 0.4); draw(3.6); }
        }, 80);
    });

    // ── boot: mask + fonts, then go ──
    const img = new Image();
    img.onload = function () {
        maskW = img.width; maskH = img.height;
        maskAspect = maskW / maskH;
        const oc = document.createElement('canvas');
        oc.width = maskW; oc.height = maskH;
        const octx = oc.getContext('2d');
        octx.drawImage(img, 0, 0);
        const d = octx.getImageData(0, 0, maskW, maskH).data;
        maskA = new Uint8Array(maskW * maskH);
        for (let p = 0; p < maskA.length; p++) maskA[p] = d[p * 4 + 3];
        document.fonts.ready.then(start);
    };
    img.src = EAGLE_SRC;
})();
</script>
