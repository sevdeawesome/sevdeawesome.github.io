const BG        = '#1a1a1a';
const CORAL     = '#ff6b6b';
const CORAL_L   = '#ff8787';
const MAROON    = '#8b2635';
const MAROON_D  = '#5c1a24';
const NAVY      = '#24344d';
const NAVY_FRAG = '#3a5170';   // muted navy, lifted just enough to read on #1a1a1a
const WHITE     = '#ffffff';

// fragment draw buckets (index = colIdx)
const BUCKET_COLORS = [
    CORAL,                       // 0 red-stripe fragment
    CORAL_L,                     // 1 red flicker-alt
    'rgba(255,255,255,0.85)',    // 2 white-stripe fragment
    'rgba(255,255,255,0.40)',    // 3 white dim / falling white
    NAVY_FRAG,                   // 4 canton fragment
    NAVY,                        // 5 navy dark / falling navy
    MAROON,                      // 6 falling red (spent material)
    'rgba(255,255,255,0.95)'     // 7 star fleck / hot flicker

const NB = BUCKET_COLORS.length;
// cross-channel flicker: red flashes white, white flashes coral, navy flashes white
const ALT = [2, 0, 1, 3, 7, 5, 6, 7];
// falling (spent) variant per base color
const FALL = [6, 6, 3, 3, 5, 5, 6, 3];

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const tel = document.getElementById('tel');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- deterministic prng ----
let _s = 1776;
function rnd() { _s = (_s * 16807) % 2147483647; return (_s - 1) / 2147483646; }

// ---- flag grid ----
const COLS = 48, ROWS = 13;
const CANTON_COLS = 19, CANTON_ROWS = 7;
const NCELL = COLS * ROWS;
const health = new Float32Array(NCELL).fill(1);
const cellPhase = new Float32Array(NCELL);
for (let i = 0; i < NCELL; i++) cellPhase[i] = rnd() * 6.283;
// cell geometry, recomputed on resize
const cellX = new Float32Array(NCELL), cellY = new Float32Array(NCELL);
let cellW = 0, cellH = 0;

// ---- layout ----
let W = 720, H = 340, dpr = 1;
let eagleX = 0, eagleY = 0, eagleW = 0, eagleH = 0;
let flagY0 = 0, flagH = 0;

// ---- fragments ----
let NPTS = 0;
let ptsNX, ptsNY;          // normalized eagle-space targets
let ftx, fty;              // pixel targets
let fsx, fsy;              // flight origin
let fpx, fpy;              // current position (falling)
let fvx, fvy;              // falling velocity
let ft, fdur, fcurve;      // flight progress
let fstate;                // 0 empty, 1 flying, 2 seated, 3 falling
let ftype;                 // 0 red, 1 white, 2 canton
let fcol;                  // base bucket
let fsize, fseed, frespawn, flandY;

// draw buckets
let bx, by, bs, bn;

// ---- sim state ----
let committed = 0;
let seatedCount = 0;
let stateLabel = 'assembling';
let gustActive = false, gustX = 0, gustDir = 1, gustT = 0;
let nextGustAt = 7.0;
let trickleAcc = 0;
let flagIntegrity = 1;
let phaseRebuilding = false;
let frame = 0;

const DONATE = 0.16;        // health a cell pays per fragment
const RETURN = 0.10;        // health returned when material lands
const REGEN  = 0.085;       // passive regen per second
const GUST_LEN = 1.15;      // seconds for a front to cross
const SPAWN_CAP = 11;       // max spawns per frame

// tinted ghost membrane (prepared once at load)
let ghost = null;
let ghostFlash = 0;

function stripeRowRed(r) { return r % 2 === 0; }

function layout() {
    const cw = Math.min(720, document.getElementById('fig').clientWidth || 720);
    W = cw;
    H = Math.round(cw * 0.47);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    flagH = H * 0.265;
    flagY0 = H - flagH - H * 0.015;
    cellW = W / COLS;
    cellH = flagH / ROWS;
    for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) {
            const i = r * COLS + c;
            cellX[i] = c * cellW;
            cellY[i] = flagY0 + r * cellH;
        }

    eagleH = H * 0.615;
    eagleW = eagleH * (377 / 403);
    eagleX = (W - eagleW) / 2;
    eagleY = H * 0.025;

    if (ptsNX) {
        for (let i = 0; i < NPTS; i++) {
            ftx[i] = eagleX + ptsNX[i] * eagleW;
            fty[i] = eagleY + ptsNY[i] * eagleH;
        }
    }
}

function makeGhost(img) {
    const g = document.createElement('canvas');
    g.width = img.width; g.height = img.height;
    const gc = g.getContext('2d');
    gc.drawImage(img, 0, 0);
    gc.globalCompositeOperation = 'source-in';
    gc.fillStyle = CORAL;
    gc.fillRect(0, 0, g.width, g.height);
    return g;
}

function initFragments(pts) {
    NPTS = pts.length;
    ptsNX = new Float32Array(NPTS); ptsNY = new Float32Array(NPTS);
    ftx = new Float32Array(NPTS);  fty = new Float32Array(NPTS);
    fsx = new Float32Array(NPTS);  fsy = new Float32Array(NPTS);
    fpx = new Float32Array(NPTS);  fpy = new Float32Array(NPTS);
    fvx = new Float32Array(NPTS);  fvy = new Float32Array(NPTS);
    ft = new Float32Array(NPTS);   fdur = new Float32Array(NPTS);
    fcurve = new Float32Array(NPTS);
    fstate = new Uint8Array(NPTS);
    ftype = new Uint8Array(NPTS);
    fcol = new Uint8Array(NPTS);
    fsize = new Float32Array(NPTS);
    fseed = new Float32Array(NPTS);
    frespawn = new Float32Array(NPTS);
    flandY = new Float32Array(NPTS);

    for (let i = 0; i < NPTS; i++) {
        const nx = pts[i][0], ny = pts[i][1];
        ptsNX[i] = nx; ptsNY[i] = ny;
        // the eagle is textured like the flag itself:
        // upper-left shoulder = canton (navy + star flecks), rest = 11 stripes
        if (nx < 0.40 && ny < 0.42) {
            ftype[i] = 2;
            fcol[i] = rnd() < 0.18 ? 7 : 4;   // star flecks in the navy field
        } else {
            const band = Math.floor(ny * 11);
            if (band % 2 === 0) { ftype[i] = 0; fcol[i] = 0; }
            else                { ftype[i] = 1; fcol[i] = 2; }
        }
        fsize[i] = 2.1 + rnd() * 1.4;
        fseed[i] = rnd() * 6.283;
        fstate[i] = 0;
        // assemble bottom-up with jittered stagger
        frespawn[i] = 0.35 + (1 - ny) * 2.3 + rnd() * 0.9;
    }

    bx = []; by = []; bs = [];
    for (let b = 0; b < NB; b++) {
        bx.push(new Float32Array(NPTS));
        by.push(new Float32Array(NPTS));
        bs.push(new Float32Array(NPTS));
    }
    bn = new Int32Array(NB);
}

function pickSourceCell(i) {
    const type = ftype[i];
    let col = Math.round((ftx[i] / W) * COLS + (rnd() - 0.5) * 9);
    if (col < 0) col = 0; if (col > COLS - 1) col = COLS - 1;
    let row;
    if (type === 2) {
        if (col > CANTON_COLS - 1) col = Math.floor(rnd() * CANTON_COLS);
        row = Math.floor(rnd() * CANTON_ROWS);
    } else {
        const parity = type === 0 ? 0 : 1;
        row = parity + 2 * Math.floor(rnd() * 6.49);
        if (row > ROWS - 1) row = ROWS - 1 - parity;
        if (row < CANTON_ROWS && col < CANTON_COLS) {
            col = CANTON_COLS + Math.floor(rnd() * (COLS - CANTON_COLS));
        }
    }
    return row * COLS + col;
}

function spawnFragment(i) {
    const ci = pickSourceCell(i);
    health[ci] = Math.max(0, health[ci] - DONATE);
    fsx[i] = cellX[ci] + rnd() * cellW;
    fsy[i] = cellY[ci] + rnd() * cellH;
    fstate[i] = 1;
    ft[i] = 0;
    fdur[i] = 0.85 + rnd() * 0.85;
    fcurve[i] = (rnd() - 0.5) * 46;
    committed++;
}

function detachFragment(i, vx, vy) {
    fstate[i] = 3;
    fpx[i] = ftx[i]; fpy[i] = fty[i];
    fvx[i] = vx; fvy[i] = vy;
    flandY[i] = flagY0 + (0.1 + rnd() * 0.8) * flagH;
}

function landFragment(i, now) {
    let col = Math.floor(fpx[i] / cellW);
    if (col < 0) col = 0; if (col > COLS - 1) col = COLS - 1;
    const row = Math.min(ROWS - 1, Math.max(0, Math.floor((fpy[i] - flagY0) / cellH)));
    const ci = row * COLS + col;
    health[ci] = Math.min(1, health[ci] + RETURN);
    fstate[i] = 0;
    frespawn[i] = now + 0.25 + rnd() * 1.6;
}

// ---- drawing ----
function drawFlag(now) {
    // red stripes
    ctx.fillStyle = MAROON;
    for (let r = 0; r < ROWS; r += 2) {
        for (let c = 0; c < COLS; c++) {
            if (r < CANTON_ROWS && c < CANTON_COLS) continue;
            const i = r * COLS + c;
            const h = health[i];
            if (h < 0.32 && (((frame >> 2) + i) % 3) === 0) continue; // torn holes shimmer
            let a = (0.26 + 0.66 * h) * (0.86 + 0.14 * Math.sin(now * 2.1 + cellPhase[i]));
            if (((frame + i * 13) & 511) < 3) a *= 0.25; // dropout blink
            ctx.globalAlpha = a;
            ctx.fillRect(cellX[i] + 0.5, cellY[i] + 0.5, cellW - 1, cellH - 1);
        }
    }
    // white stripes
    ctx.fillStyle = WHITE;
    for (let r = 1; r < ROWS; r += 2) {
        for (let c = 0; c < COLS; c++) {
            if (r < CANTON_ROWS && c < CANTON_COLS) continue;
            const i = r * COLS + c;
            const h = health[i];
            if (h < 0.32 && (((frame >> 2) + i) % 3) === 0) continue;
            let a = (0.07 + 0.24 * h) * (0.84 + 0.16 * Math.sin(now * 2.4 + cellPhase[i]));
            if (((frame + i * 13) & 511) < 3) a *= 0.25;
            ctx.globalAlpha = a;
            ctx.fillRect(cellX[i] + 0.5, cellY[i] + 0.5, cellW - 1, cellH - 1);
        }
    }
    // canton
    ctx.fillStyle = NAVY;
    for (let r = 0; r < CANTON_ROWS; r++) {
        for (let c = 0; c < CANTON_COLS; c++) {
            const i = r * COLS + c;
            const h = health[i];
            if (h < 0.32 && (((frame >> 2) + i) % 3) === 0) continue;
            let a = (0.30 + 0.62 * h) * (0.88 + 0.12 * Math.sin(now * 1.8 + cellPhase[i]));
            ctx.globalAlpha = a;
            ctx.fillRect(cellX[i] + 0.5, cellY[i] + 0.5, cellW - 1, cellH - 1);
        }
    }
    // star flecks in canton
    ctx.fillStyle = WHITE;
    const sd = Math.max(1.4, cellW * 0.16);
    for (let r = 0; r < CANTON_ROWS; r++) {
        for (let c = 0; c < CANTON_COLS; c++) {
            if ((r + c) % 2 !== 0) continue;
            const i = r * COLS + c;
            ctx.globalAlpha = (0.16 + 0.5 * health[i]) * (0.8 + 0.2 * Math.sin(now * 3 + cellPhase[i] * 2));
            ctx.fillRect(cellX[i] + cellW * 0.5 - sd / 2, cellY[i] + cellH * 0.5 - sd / 2, sd, sd);
        }
    }
    ctx.globalAlpha = 1;
}

function drawGhost() {
    if (!ghost) return;
    const a = 0.045 + ghostFlash * 0.17 + 0.012 * Math.sin(frame * 0.05);
    ctx.globalAlpha = Math.max(0.02, a);
    ctx.drawImage(ghost, eagleX, eagleY, eagleW, eagleH);
    ctx.globalAlpha = 1;
}

function drawGustStreaks(now) {
    if (!gustActive) return;
    // thin horizontal wind streaks riding the front, so the tear reads as a force
    for (let k = 0; k < 14; k++) {
        const yy = eagleY + ((k * 0.0731 + 0.03) % 1) * (eagleH + 30);
        const jitter = Math.sin(now * 9 + k * 2.3) * 18;
        const len = 26 + ((k * 37) % 40);
        const xx = gustX - gustDir * (k % 5) * 16 + jitter;
        ctx.fillStyle = (k % 3 === 0) ? CORAL : WHITE;
        ctx.globalAlpha = 0.05 + 0.05 * ((k * 29) % 3);
        ctx.fillRect(gustDir > 0 ? xx - len : xx, yy, len, 1.2);
    }
    ctx.globalAlpha = 1;
}

function drawFragments(now) {
    for (let b = 0; b < NB; b++) bn[b] = 0;
    const gustBand = 78;
    for (let i = 0; i < NPTS; i++) {
        const st = fstate[i];
        if (st === 0) continue;
        let x, y, b;
        if (st === 2) {
            x = ftx[i] + Math.sin(now * 2.2 + fseed[i]) * 0.55;
            y = fty[i] + Math.cos(now * 1.9 + fseed[i] * 1.7) * 0.45;
            b = fcol[i];
            if (gustActive) { // wind shear near the front
                const p = 1 - Math.abs(x - gustX) / gustBand;
                if (p > 0) x += gustDir * p * p * 9;
            }
            if (((frame * 31 + i * 17) & 255) < 5) b = ALT[b]; // cross-channel flicker
        } else if (st === 1) {
            const t = ft[i];
            const e = t * t * (3 - 2 * t);
            x = fsx[i] + (ftx[i] - fsx[i]) * e + Math.sin(t * 3.1416) * fcurve[i];
            y = fsy[i] + (fty[i] - fsy[i]) * e;
            b = t > 0.86 ? fcol[i] : ALT[fcol[i]] === 7 ? 7 : fcol[i];
        } else { // falling: spent material, dimmer
            x = fpx[i]; y = fpy[i];
            b = FALL[fcol[i]];
        }
        const n = bn[b];
        bx[b][n] = x; by[b][n] = y; bs[b][n] = fsize[i];
        bn[b] = n + 1;
    }
    for (let b = 0; b < NB; b++) {
        const n = bn[b];
        if (!n) continue;
        ctx.fillStyle = BUCKET_COLORS[b];
        const X = bx[b], Y = by[b], S = bs[b];
        for (let k = 0; k < n; k++) {
            const s = S[k];
            ctx.fillRect(X[k] - s / 2, Y[k] - s / 2, s, s);
        }
    }
}

function scanTear() {
    // occasional CRT-style band tear: copy thin strips of the finished frame sideways
    if ((frame & 255) > 9) return;
    const bands = 2;
    for (let k = 0; k < bands; k++) {
        const yy = Math.floor((((frame * 37 + k * 977) % 100) / 100) * H * 0.9);
        const hh = 3 + (frame % 5);
        const off = ((frame + k) % 2 === 0 ? 1 : -1) * (4 + (frame % 7));
        ctx.drawImage(canvas,
            0, yy * dpr, canvas.width, hh * dpr,
            off, yy, W, hh);
    }
}

// ---- simulation ----
function step(dt, now) {
    // flag regen
    for (let i = 0; i < NCELL; i++) {
        const h = health[i];
        if (h < 1) health[i] = Math.min(1, h + REGEN * dt);
    }

    // gust scheduling
    if (!gustActive && now > nextGustAt) {
        gustActive = true;
        gustT = 0;
        gustDir = rnd() < 0.5 ? -1 : 1;
        stateLabel = 'gust shear';
        ghostFlash = 1;
    }
    if (gustActive) {
        gustT += dt;
        const prog = gustT / GUST_LEN;
        gustX = gustDir > 0 ? -60 + prog * (W + 120) : W + 60 - prog * (W + 120);
        // detach seated fragments near the front
        const band = 62;
        for (let i = 0; i < NPTS; i++) {
            if (fstate[i] !== 2) continue;
            const d = Math.abs(ftx[i] - gustX);
            if (d < band && rnd() < 0.05) {
                detachFragment(i,
                    gustDir * (70 + rnd() * 150) + (rnd() - 0.5) * 40,
                    -(20 + rnd() * 70));
            }
        }
        if (prog >= 1) {
            gustActive = false;
            phaseRebuilding = true;
            nextGustAt = now + 7.5 + rnd() * 3.5;
        }
    }
    if (ghostFlash > 0) ghostFlash = Math.max(0, ghostFlash - dt * 0.6);

    // maintenance trickle: even a held shape sheds material continuously
    trickleAcc += seatedCount * 0.012 * dt;
    while (trickleAcc >= 1) {
        trickleAcc -= 1;
        const i = Math.floor(rnd() * NPTS);
        if (fstate[i] === 2) {
            detachFragment(i, (rnd() - 0.5) * 50, -(10 + rnd() * 40));
        }
    }

    // advance flying + falling, spawn empties
    let spawned = 0;
    seatedCount = 0;
    for (let i = 0; i < NPTS; i++) {
        const st = fstate[i];
        if (st === 1) {
            ft[i] += dt / fdur[i];
            if (ft[i] >= 1) { fstate[i] = 2; }
        } else if (st === 3) {
            fvy[i] += 320 * dt;
            fpx[i] += fvx[i] * dt;
            fpy[i] += fvy[i] * dt;
            fvx[i] *= (1 - 1.6 * dt);
            if (fpy[i] >= flandY[i]) landFragment(i, now);
        } else if (st === 0) {
            if (spawned < SPAWN_CAP && now >= frespawn[i]) {
                spawnFragment(i);
                spawned++;
            }
        }
        if (fstate[i] === 2) seatedCount++;
    }

    // state label
    const ratio = seatedCount / NPTS;
    if (gustActive) stateLabel = 'gust shear';
    else if (phaseRebuilding && ratio < 0.9) stateLabel = 'rebuilding';
    else if (ratio >= 0.9) { stateLabel = 'shape holding'; phaseRebuilding = false; }
    else if (committed < NPTS * 1.2) stateLabel = 'assembling';
}

// ---- telemetry ----
let lastTel = 0;
function updateTelemetry(now) {
    if (now - lastTel < 0.22) return;
    lastTel = now;
    let sum = 0;
    for (let i = 0; i < NCELL; i++) sum += health[i];
    flagIntegrity = sum / NCELL;
    tel.innerHTML =
        'signal: us_1776 &nbsp;&middot;&nbsp; fragments committed: <span>' +
        committed.toLocaleString('en-US') +
        '</span> &nbsp;&middot;&nbsp; flag integrity: <span>' +
        Math.round(flagIntegrity * 100) +
        '%</span> &nbsp;&middot;&nbsp; <span>' + stateLabel + '</span>';
}

// ---- main loop ----
let lastT = 0;
function loop(ms) {
    const now = ms / 1000;
    let dt = now - lastT;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt <= 0) dt = 0.016;
    frame++;

    step(dt, now);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    drawFlag(now);
    drawGhost();
    drawFragments(now);
    drawGustStreaks(now);
    scanTear();
    updateTelemetry(now);

    requestAnimationFrame(loop);
}

// ---- static frame for reduced motion ----
function staticFrame() {
    for (let i = 0; i < NPTS; i++) fstate[i] = 2;
    seatedCount = NPTS;
    committed = NPTS;
    // show the cost: fabric drained under the eagle's shadow
    const cx = COLS / 2;
    for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) {
            const d = Math.abs(c - cx) / cx;
            health[r * COLS + c] = 0.45 + 0.55 * d;
        }
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    frame = 100;
    drawFlag(1.0);
    ghostFlash = 0.3;
    drawGhost();
    drawFragments(1.0);
    let sum = 0;
    for (let i = 0; i < NCELL; i++) sum += health[i];
    tel.innerHTML =
        'signal: us_1776 &nbsp;&middot;&nbsp; fragments committed: <span>' +
        NPTS.toLocaleString('en-US') +
        '</span> &nbsp;&middot;&nbsp; flag integrity: <span>' +
        Math.round((sum / NCELL) * 100) +
        '%</span> &nbsp;&middot;&nbsp; <span>shape holding</span>';
}

// ---- boot ----
function samplePoints(img) {
    const oc = document.createElement('canvas');
    oc.width = img.width; oc.height = img.height;
    const octx = oc.getContext('2d');
    octx.drawImage(img, 0, 0);
    const d = octx.getImageData(0, 0, img.width, img.height).data;
    let step = 6, pts = [];
    while (step < 12) {
        pts = [];
        for (let y = 0; y < img.height; y += step)
            for (let x = 0; x < img.width; x += step)
                if (d[(y * img.width + x) * 4 + 3] > 128)
                    pts.push([x / img.width, y / img.height]);
        if (pts.length <= 1500) break;
        step++;
    }
    return pts;
}

let resizeTimer = null;
window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
        layout();
        if (reduced) staticFrame();
    }, 80);
});

document.fonts.ready.then(function () {
    const img = new Image();
    img.onload = function () {
        const pts = samplePoints(img);
        ghost = makeGhost(img);
        initFragments(pts);
        layout();
        if (reduced) {
            staticFrame();
        } else {
            requestAnimationFrame(function (ms) {
                lastT = ms / 1000;
                requestAnimationFrame(loop);
            });
        }
    };
    img.src = EAGLE_SRC;
});

})();
</script>
</body>
