const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const elDrift = document.getElementById('tDrift');
const elFut = document.getElementById('tFut');
const elStat = document.getElementById('tStat');
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, dpr = 1;

/* ---------- sprites: pre-tinted copies, built once ---------- */
const img = new Image();
const sprites = {};            // name -> offscreen canvas
const TINTS = {
    white:  '#ffffff',
    coral:  '#ff6b6b',
    m1:     '#8b2635',
    m2:     '#5c1a24',
    m3:     '#2a0d12',
    navy:   '#2e4057',
    navy2:  '#24344d'
};
function buildSprites(){
    for(const k in TINTS){
        const c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        const x = c.getContext('2d');
        x.drawImage(img, 0, 0);
        x.globalCompositeOperation = 'source-in';
        x.fillStyle = TINTS[k];
        x.fillRect(0, 0, c.width, c.height);
        sprites[k] = c;
    }
}

/* ---------- deterministic flight path: any time is samplable ---------- */
function px(u){ return W*0.50 + W*0.285*Math.sin(u*0.44) + W*0.055*Math.sin(u*1.03 + 2.1); }
function py(u){ return H*0.44 + H*0.205*Math.sin(u*0.68 + 0.9) + H*0.050*Math.sin(u*1.31); }
function vel(u, h){ return { x:(px(u+h)-px(u-h))/(2*h), y:(py(u+h)-py(u-h))/(2*h) }; }
function facing(u){ return vel(u, 0.55).x >= 0 ? 1 : -1; }   // wide window = calm flips
function tilt(u){
    const v = vel(u, 0.20);
    const a = Math.atan2(v.y, Math.abs(v.x) + 60) * 0.55;
    return Math.max(-0.16, Math.min(0.16, a));
}

/* ---------- draw helpers ---------- */
const EAGLE_W = 118;           // css px on canvas
function eagleH(){ return EAGLE_W * (img.height / img.width); }

function blit(spr, x, y, alpha, scale, rot, flip){
    const w = EAGLE_W*scale, h = eagleH()*scale;
    ctx.save();
    ctx.translate(x, y);
    if(rot) ctx.rotate(rot * flip);
    ctx.scale(flip, 1);
    ctx.globalAlpha = alpha;
    ctx.drawImage(spr, -w/2, -h/2, w, h);
    ctx.restore();
}
/* sliced blit: horizontal bands displaced sideways — shattered time */
function blitSliced(spr, x, y, alpha, scale, flip, amt, seed){
    const w = EAGLE_W*scale, h = eagleH()*scale;
    const N = 4, sh = spr.height / N, bh = h / N;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flip, 1);
    ctx.globalAlpha = alpha;
    for(let k = 0; k < N; k++){
        const off = Math.sin(seed*12.9 + k*4.7 + seed*k) * amt;
        ctx.drawImage(spr, 0, sh*k, spr.width, sh, -w/2 + off, -h/2 + bh*k, w, bh);
    }
    ctx.restore();
}

/* ---------- flag field ---------- */
const STARS = [];
for(let r = 0; r < 5; r++) for(let c = 0; c < 6; c++)
    STARS.push({ r, c, ph: Math.random()*6.28, sp: 0.6 + Math.random()*0.9 });

function drawFlag(E){
    const sh = H / 13;
    for(let i = 0; i < 13; i++){
        ctx.fillStyle = (i % 2 === 0) ? 'rgba(139,38,53,0.135)' : 'rgba(255,255,255,0.045)';
        ctx.fillRect(0, i*sh, W, sh + 0.5);
    }
    const cw = W*0.355, ch = sh*7;
    ctx.fillStyle = 'rgba(36,52,77,0.17)';
    ctx.fillRect(0, 0, cw, ch);
    for(const s of STARS){
        const a = 0.05 + 0.055*(0.5 + 0.5*Math.sin(E*s.sp + s.ph));
        ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
        ctx.fillRect(cw*(0.09 + s.c*0.155), ch*(0.11 + s.r*0.185), 2, 2);
    }
}

/* ---------- wake erosion: the field decays where the eagle has been ---------- */
const CELLS = [];              // ring buffer of {x,y,w,h,born}
const CELL_MAX = 140, CELL_LIFE = 2.6;
let cellIdx = 0;
function spawnCells(x, y, E){
    for(let n = 0; n < 2; n++){
        const c = { x: x + (Math.random()-0.5)*EAGLE_W*0.9,
                    y: y + (Math.random()-0.5)*eagleH()*0.8,
                    w: 3 + Math.random()*7, h: 2 + Math.random()*4, born: E };
        if(CELLS.length < CELL_MAX) CELLS.push(c);
        else { CELLS[cellIdx] = c; cellIdx = (cellIdx + 1) % CELL_MAX; }
    }
}
function drawCells(E){
    ctx.fillStyle = '#1a1a1a';
    for(const c of CELLS){
        const age = (E - c.born) / CELL_LIFE;
        if(age >= 1) continue;
        ctx.globalAlpha = age < 0.15 ? age/0.15 : 1 - (age-0.15)/0.85;
        ctx.fillRect(c.x, c.y, c.w, c.h);
    }
    ctx.globalAlpha = 1;
}

/* ---------- timeline dots: the path itself, colored by tense ---------- */
function pathDot(u, T, E, shatter){
    const d = u - T;                       // seconds from present
    let col, a;
    if(d < 0){
        const f = Math.min(1, -d/2);       // 0 fresh → 1 old
        col = f < 0.4 ? '255,107,107' : (f < 0.75 ? '139,38,53' : '92,26,36');
        a = 0.34 * (1 - f*0.8);
    } else if(d < 0.04){ col = '255,255,255'; a = 0.8; }
    else {
        col = '46,64,87'; a = 0.55 * (1 - d);
        if(shatter > 0) a *= (Math.random() > 0.5 ? 1.4 : 0.3);   // future line flickers
    }
    const jx = d > 0 ? (Math.random()-0.5)*2.5*(1+shatter*3) : 0;
    ctx.fillStyle = 'rgba(' + col + ',' + a.toFixed(3) + ')';
    ctx.fillRect(px(u) + jx - 1, py(u) - 1, 2, 2);
}

/* ---------- state ---------- */
const PAST_N = 7, PAST_DT = 0.28, LEAD = 1.0;
const PAST_SPR = ['coral','m1','m1','m2','m2','m3','m3'];
let T = 0;                     // path time (jumps on skip)
let E = 0;                     // wall time
let last = 0;
let nextSkipE = 5.5 + Math.random()*3;
let skipStartE = -10;
const SKIP_DUR = 0.7;
let nextMicroE = 2.2, microEndE = -1, microOX = 0, microOY = 0;
let futSeeds = [0, 0, 0];
let telFrames = 0, drift = 9;

function drawScene(){
    ctx.clearRect(0, 0, W, H);
    const shatter = Math.max(0, 1 - (E - skipStartE)/SKIP_DUR);  // 1 → 0 during event
    const X = px(T), Y = py(T);

    drawFlag(E);
    drawCells(E);

    /* tear lines: first flash of a skip */
    if(shatter > 0.82){
        ctx.fillStyle = 'rgba(255,107,107,0.13)';
        ctx.fillRect(0, Y - 7, W, 1);
        ctx.fillStyle = 'rgba(46,64,87,0.30)';
        ctx.fillRect(0, Y + 5, W, 1);
    }

    /* timeline dotted path: t−2s … t+1s */
    for(let u = T - 2.0; u <= T + LEAD; u += 0.09) pathDot(u, T, E, shatter);

    /* past ghosts — oldest first so newer stack on top */
    for(let i = PAST_N; i >= 1; i--){
        const u = T - i*PAST_DT;
        const gx = px(u), gy = py(u) + i*1.3;          // old echoes settle downward
        const f = i / PAST_N;
        let a = 0.30 * (1 - f) + 0.05;
        const spr = sprites[PAST_SPR[i-1]];
        const baseSlice = i >= 5 ? 2.5 : 0;            // oldest echoes always fray a little
        const amt = baseSlice + shatter * 14;
        if(shatter > 0) a = Math.min(0.6, a * (1 + shatter*1.6));
        if(amt > 0.5) blitSliced(spr, gx, gy, a, 1 - f*0.06, facing(u), amt, i + Math.floor(E*7)*0.13);
        else blit(spr, gx, gy, a, 1 - f*0.06, tilt(u), facing(u));
    }

    /* future ghost(s) */
    const micro = E < microEndE;
    if(shatter > 0.05){
        /* competing futures, collapsing to one */
        const leads = [0.62, 1.05, 1.5];
        for(let k = 0; k < 3; k++){
            const u = T + leads[k];
            const conv = shatter;                       // 1 apart → 0 merged
            const ox = Math.sin(futSeeds[k]*9.2) * 46 * conv;
            const oy = Math.cos(futSeeds[k]*5.1) * 22 * conv;
            const fl = 0.24 + 0.26*Math.random();
            blit(k === 1 ? sprites.navy : sprites.navy2,
                 px(u) + ox, py(u) + oy, fl, 0.98, tilt(u), facing(u));
        }
    } else {
        const u = T + LEAD;
        const jx = (Math.random()-0.5)*3, jy = (Math.random()-0.5)*3;
        const ox = micro ? microOX : 0, oy = micro ? microOY : 0;
        const a = micro ? 0.55 : 0.40 + 0.07*Math.sin(E*7.3);
        blit(sprites.navy, px(u) + jx + ox, py(u) + jy + oy, a, 0.99, tilt(u), facing(u));
        if(micro)  /* faint echo left at the true position while it errs */
            blit(sprites.navy2, px(u), py(u), 0.14, 0.99, tilt(u), facing(u));
    }

    /* present — the one crisp thing in the frame */
    blit(sprites.white, X, Y, 1, 1, tilt(T), facing(T));

    /* whispered tense labels (dark backing pass keeps them legible over the white body) */
    ctx.font = '10px Rubik, sans-serif';
    ctx.textAlign = 'center';
    function label(txt, x, y, col){
        ctx.fillStyle = 'rgba(26,26,26,0.85)';
        ctx.fillText(txt, x + 1, y + 1);
        ctx.fillText(txt, x - 1, y + 1);
        ctx.fillStyle = col;
        ctx.fillText(txt, x, y);
    }
    const uPast = T - 1.9, uF = T + LEAD;
    label('t−2s', px(uPast), py(uPast) + eagleH()*0.5 + 16, 'rgba(178,74,88,0.85)');
    label('t', X, Y + eagleH()*0.5 + 16, 'rgba(255,255,255,0.6)');
    if(Math.hypot(px(uF) - X, py(uF) - Y) > 42)   // don't stack on 't' at turnarounds
        label(shatter > 0.05 ? 't+?s' : 't+1s', px(uF), py(uF) + eagleH()*0.5 + 16, 'rgba(120,147,181,0.9)');
}

function frame(now){
    if(!last) last = now;
    let dt = Math.min(0.05, (now - last)/1000);
    last = now;
    E += dt; T += dt;

    /* schedule the time-skip: the present jumps, everything else reels */
    if(E >= nextSkipE){
        T += 0.55;
        skipStartE = E;
        nextSkipE = E + 6 + Math.random()*4;
        futSeeds = [Math.random()*10, Math.random()*10, Math.random()*10];
        drift = 480 + Math.random()*220;
    }
    /* micro-glitch: the forecast is briefly wrong, then corrects */
    if(E >= nextMicroE && E > skipStartE + SKIP_DUR){
        microEndE = E + 0.15 + Math.random()*0.1;
        microOX = (Math.random()-0.5)*76;
        microOY = (Math.random()-0.5)*40;
        nextMicroE = E + 1.6 + Math.random()*1.8;
    }

    spawnCells(px(T), py(T), E);
    drawScene();

    /* telemetry, throttled */
    if(++telFrames >= 7){
        telFrames = 0;
        const inSkip = E - skipStartE < SKIP_DUR;
        drift = inSkip ? drift : Math.max(6, drift*0.82) ;
        const shown = inSkip ? drift : 6 + Math.abs(Math.sin(E*1.7))*14;
        elDrift.textContent = '+' + String(Math.round(shown)).padStart(3,'0') + ' ms';
        elFut.textContent = '×' + (inSkip ? '3' : '1');
        elStat.textContent = inSkip ? 'TIME SKIP' : 'COHERENT';
        elStat.className = inSkip ? 'skip' : '';
    }
    requestAnimationFrame(frame);
}

/* ---------- sizing ---------- */
function size(){
    const st = document.getElementById('stage');
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = st.clientWidth; H = st.clientHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CELLS.length = 0; cellIdx = 0;
    if(REDUCED && sprites.white) staticFrame();
}
let rsT;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(size, 80); });

/* one good still: full temporal split, no motion */
function staticFrame(){
    T = 8.6; E = 8.6; skipStartE = -10; microEndE = -1;
    for(let i = 0; i < 26; i++)
        spawnCells(px(T - Math.random()*1.8), py(T - Math.random()*1.8), E - Math.random()*1.5);
    drawScene();
    elDrift.textContent = '+009 ms';
    elStat.textContent = 'COHERENT';
}

img.onload = function(){
    buildSprites();
    document.fonts.ready.then(() => {
        size();
        if(REDUCED) staticFrame();
        else requestAnimationFrame(frame);
    });
};
img.src = EAGLE_SRC;
})();
</script>
