<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degrading Signal — Flag Figure B</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rubik', sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 22px 18px 14px;
            user-select: none;
            overflow-x: hidden;
        }

        #fig {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #fff;
            margin-bottom: 3px;
        }
        .chart-subtitle {
            font-size: 0.73rem;
            color: rgba(255,255,255,0.42);
            margin-bottom: 16px;
            letter-spacing: 0.2px;
        }

        /* ── Stage: the grid lives inside an overflow-visible stage so
              escaping particles can drift past the right edge into the
              page margin, per the reference mockup. ── */
        #stage {
            position: relative;
            width: 100%;
            overflow: visible;
        }

        #flag-svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible;
        }

        /* divider line partway through the signal */
        .divider {
            stroke: rgba(255,255,255,0.14);
            stroke-width: 0.6;
            stroke-dasharray: 2 2.4;
        }

        /* base cell */
        .cell {
            transform-box: fill-box;
            transform-origin: center;
        }

        /* stars */
        .star {
            transform-box: fill-box;
            transform-origin: center;
        }

        /* ── Flicker keyframes: subtle opacity breathing across most cells ── */
        @keyframes flicker-a {
            0%   { opacity: var(--o); }
            38%  { opacity: calc(var(--o) * 0.55); }
            52%  { opacity: var(--o); }
            77%  { opacity: calc(var(--o) * 0.72); }
            100% { opacity: var(--o); }
        }
        @keyframes flicker-b {
            0%   { opacity: var(--o); }
            21%  { opacity: calc(var(--o) * 0.4); }
            44%  { opacity: var(--o); }
            68%  { opacity: calc(var(--o) * 0.6); }
            100% { opacity: var(--o); }
        }

        .flicker-a { animation: flicker-a 3.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
        .flicker-b { animation: flicker-b 2.6s ease-in-out infinite; animation-delay: var(--d, 0s); }

        /* ── Glitch cells: chromatic-aberration style double-shadow via
              filter drop-shadow, plus a brief positional jolt ── */
        @keyframes glitch-jolt {
            0%, 88%, 100% { transform: translate(0, 0); filter: none; }
            90%  { transform: translate(1.6px, -0.6px); filter: drop-shadow(-1.4px 0 rgba(255,107,107,0.9)) drop-shadow(1.4px 0 rgba(255,255,255,0.6)); }
            92%  { transform: translate(-1.2px, 0.5px); filter: drop-shadow(1.6px 0 rgba(255,107,107,0.9)) drop-shadow(-1.6px 0 rgba(255,255,255,0.5)); }
            94%  { transform: translate(0.8px, -0.4px); filter: drop-shadow(-1px 0 rgba(255,107,107,0.8)) drop-shadow(1px 0 rgba(255,255,255,0.4)); }
            96%  { transform: translate(0, 0); filter: none; }
        }
        .glitching { animation: glitch-jolt 5.5s linear infinite; animation-delay: var(--gd, 0s); }

        /* ── Escaping particles: right-edge cells that periodically drift
              outward off the flag into the margin, fading as they go ── */
        @keyframes escape {
            0%, 55%  { transform: translate(0, 0) scale(1); opacity: var(--o); }
            75%      { opacity: calc(var(--o) * 0.85); }
            100%     { transform: translate(var(--ex, 14px), var(--ey, -6px)) scale(0.35); opacity: 0; }
        }
        .escaping {
            animation: escape var(--edur, 4.2s) cubic-bezier(.4,0,.7,1) infinite;
            animation-delay: var(--ed, 0s);
        }

        /* white noise sparks scattered in the frayed zone */
        @keyframes spark {
            0%, 100% { opacity: 0; }
            50%      { opacity: var(--so, 0.8); }
        }
        .spark { animation: spark var(--sdur, 1.8s) ease-in-out infinite; animation-delay: var(--sd, 0s); }

        .chart-source {
            font-family: 'Rubik', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 0.3px;
            color: rgba(255,255,255,0.22);
            margin-top: 14px;
            text-align: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .flicker-a, .flicker-b, .glitching, .escaping, .spark {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
<div id="fig">
    <div id="stage">
        <svg id="flag-svg" viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A grid-rendered American flag that degrades from saturated dark red on the left into scattered glitch pixels drifting off the right edge, illustrating a signal fraying under strain."></svg>
    </div>
    <div class="chart-source">signal: us_1776 &nbsp;·&nbsp; integrity degrading &nbsp;·&nbsp; energy required to maintain</div>
</div>

<script>
(function () {
    const svg = document.getElementById('flag-svg');
    const NS = 'http://www.w3.org/2000/svg';

    // ── Layout constants ──
    const VBW = 640, VBH = 340;
    const COLS = 40;          // full-width columns of the degradation grid
    const ROWS = 13;          // 13 stripes
    const CELL_W = VBW / COLS;
    const CELL_H = VBH / ROWS;

    // Canton occupies the classic ~0.54 width x 7 stripes height
    const CANTON_COLS = Math.round(COLS * 0.40); // ~16 cols
    const CANTON_ROWS = 7;

    // Palette (from style.md only)
    const CORAL = '#ff6b6b';
    const CORAL_LIGHT = '#ff8787';
    const MAROON_DEEP = '#5c1a24';
    const MAROON = '#8b2635';
    const WHITE = '#ffffff';
    const BG = '#1a1a1a';

    function frag() { return document.createDocumentFragment(); }
    function el(tag, attrs) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        return e;
    }

    // degradation factor: 0 at far left (fully intact/deep), 1 at far right (fully frayed)
    function degradation(colIndex) {
        return colIndex / (COLS - 1);
    }

    // Interpolate between two hex colors
    function lerpColor(c1, c2, t) {
        const a = parseInt(c1.slice(1), 16);
        const b = parseInt(c2.slice(1), 16);
        const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
        const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
        const r = Math.round(ar + (br - ar) * t);
        const g = Math.round(ag + (bg - ag) * t);
        const bl = Math.round(ab + (bb - ab) * t);
        return `rgb(${r},${g},${bl})`;
    }

    // deterministic pseudo-random (so it's stable across renders/resizes)
    function seeded(i) {
        const x = Math.sin(i * 12.9898) * 43758.5453;
        return x - Math.floor(x);
    }

    const root = frag();

    // background plate (keeps SVG bg matching page bg, transparent is also fine but explicit is safer inside iframes)
    root.appendChild(el('rect', { x: 0, y: 0, width: VBW, height: VBH, fill: BG }));

    let seedCounter = 0;

    // ── Build the stripe/canton grid ──
    for (let row = 0; row < ROWS; row++) {
        const isCantonRow = row < CANTON_ROWS;
        const stripeIsRed = row % 2 === 0; // odd stripes conceptually "red", even "white" in real flag; here all driven by degradation gradient + stripe parity for texture

        for (let col = 0; col < COLS; col++) {
            const inCanton = isCantonRow && col < CANTON_COLS;
            const t = degradation(col); // 0 -> left/intact, 1 -> right/frayed
            seedCounter++;
            const rnd = seeded(seedCounter);
            const rnd2 = seeded(seedCounter + 1000);

            const x = col * CELL_W;
            const y = row * CELL_H;

            // ── Determine base color ──
            let fill, opacity;

            if (inCanton) {
                // canton: deep maroon field, degrading in saturation slightly across its own width
                const cantonT = col / CANTON_COLS;
                fill = lerpColor(MAROON_DEEP, MAROON, cantonT * 0.6);
                opacity = 0.96 - cantonT * 0.08;
            } else {
                // stripe field: left = deep maroon, mid = maroon->coral, right = coral -> washed/white-noise
                if (t < 0.30) {
                    fill = lerpColor(MAROON_DEEP, MAROON, t / 0.30);
                    opacity = stripeIsRed ? 0.94 : 0.5;
                } else if (t < 0.62) {
                    const local = (t - 0.30) / 0.32;
                    fill = lerpColor(MAROON, CORAL, local);
                    opacity = stripeIsRed ? (0.9 - local * 0.15) : (0.46 - local * 0.1);
                } else if (t < 0.85) {
                    const local = (t - 0.62) / 0.23;
                    fill = lerpColor(CORAL, CORAL_LIGHT, local);
                    opacity = stripeIsRed ? (0.75 - local * 0.35) : (0.32 - local * 0.18);
                } else {
                    // frayed zone: washed out, some cells become near-white noise, some go transparent/missing
                    const local = (t - 0.85) / 0.15;
                    fill = lerpColor(CORAL_LIGHT, WHITE, local * 0.7);
                    opacity = Math.max(0.05, (stripeIsRed ? 0.4 : 0.18) - local * 0.3);
                }
            }

            // skip rendering some cells entirely in the deep-fray zone to create "missing pixel" gaps
            const inFrayZone = t > 0.82 && !inCanton;
            const dropOut = inFrayZone && rnd < 0.22;
            if (dropOut) continue;

            const rect = el('rect', {
                class: 'cell',
                x: (x + CELL_W * 0.09).toFixed(2),
                y: (y + CELL_H * 0.09).toFixed(2),
                width: (CELL_W * 0.82).toFixed(2),
                height: (CELL_H * 0.82).toFixed(2),
                rx: 0.6,
                fill: fill
            });
            rect.style.setProperty('--o', opacity.toFixed(2));
            rect.style.opacity = opacity.toFixed(2);

            // add gentle flicker to a subset of cells for ambient life
            if (rnd2 < 0.45) {
                rect.classList.add(rnd2 < 0.22 ? 'flicker-a' : 'flicker-b');
                rect.style.setProperty('--d', (rnd * 3).toFixed(2) + 's');
            }

            // glitch-jolt: concentrate in the transition/fray band (t between 0.55 and 1)
            if (t > 0.5 && rnd > 0.7) {
                rect.classList.add('glitching');
                rect.style.setProperty('--gd', (rnd2 * 6).toFixed(2) + 's');
            }

            // escaping particles: only right-edge fray zone cells
            if (t > 0.78 && rnd > 0.55) {
                rect.classList.add('escaping');
                const dir = rnd2 > 0.5 ? 1 : -1;
                rect.style.setProperty('--ex', (10 + rnd * 46).toFixed(1) + 'px');
                rect.style.setProperty('--ey', (dir * (4 + rnd2 * 18)).toFixed(1) + 'px');
                rect.style.setProperty('--edur', (3 + rnd * 3.5).toFixed(2) + 's');
                rect.style.setProperty('--ed', (rnd2 * 4).toFixed(2) + 's');
            }

            root.appendChild(rect);
        }
    }

    // ── Star canton dots (simplified grid of stars-as-dots) ──
    const starCols = 8, starRows = 5; // staggered feel via offset rows
    const cantonW = CANTON_COLS * CELL_W;
    const cantonH = CANTON_ROWS * CELL_H;
    const padX = cantonW * 0.09, padY = cantonH * 0.10;
    const usableW = cantonW - padX * 2;
    const usableH = cantonH - padY * 2;

    for (let r = 0; r < starRows; r++) {
        const cols = (r % 2 === 0) ? starCols : starCols - 1;
        const rowOffset = (r % 2 === 0) ? 0 : (usableW / cols) * 0.5;
        for (let c = 0; c < cols; c++) {
            seedCounter++;
            const rnd = seeded(seedCounter);
            const cx = padX + rowOffset + (usableW / (cols)) * (c + 0.5) * (r % 2 === 0 ? (cols / starCols) : 1);
            const cxAdj = padX + (r % 2 === 0
                ? (usableW / starCols) * (c + 0.5)
                : (usableW / (starCols - 1)) * (c + 0.5));
            const cy = padY + (usableH / starRows) * (r + 0.5);

            // stars fade/degrade slightly toward the right edge of the canton too
            const localT = cxAdj / usableW;
            const starOpacity = 0.92 - localT * 0.22 - rnd * 0.08;
            const size = 3.1 + (rnd - 0.5) * 0.6;

            const star = el('rect', {
                class: 'star',
                x: (cxAdj - size / 2).toFixed(2),
                y: (cy - size / 2).toFixed(2),
                width: size.toFixed(2),
                height: size.toFixed(2),
                rx: size * 0.5,
                fill: WHITE
            });
            star.style.opacity = starOpacity.toFixed(2);
            if (rnd < 0.5) {
                star.classList.add(rnd < 0.25 ? 'flicker-a' : 'flicker-b');
                star.style.setProperty('--o', starOpacity.toFixed(2));
                star.style.setProperty('--d', (rnd * 4).toFixed(2) + 's');
            }
            root.appendChild(star);
        }
    }

    // ── Scattered white noise sparks in the frayed right margin (drifting past the flag edge) ──
    const sparkCount = 26;
    for (let i = 0; i < sparkCount; i++) {
        seedCounter++;
        const rnd = seeded(seedCounter);
        const rnd2 = seeded(seedCounter + 500);
        const rnd3 = seeded(seedCounter + 900);
        const x = VBW * (0.86 + rnd * 0.22); // spans right edge into margin beyond VBW
        const y = rnd2 * VBH;
        const size = 1 + rnd3 * 2.4;
        const spark = el('rect', {
            class: 'spark cell',
            x: x.toFixed(2),
            y: y.toFixed(2),
            width: size.toFixed(2),
            height: size.toFixed(2),
            fill: rnd3 > 0.6 ? WHITE : CORAL_LIGHT
        });
        spark.style.setProperty('--so', (0.35 + rnd * 0.5).toFixed(2));
        spark.style.setProperty('--sdur', (1.1 + rnd2 * 2.2).toFixed(2) + 's');
        spark.style.setProperty('--sd', (rnd3 * 3).toFixed(2) + 's');
        root.appendChild(spark);
    }

    // ── Divider line partway through the signal (marks where fraying begins) ──
    const dividerX = VBW * 0.62;
    root.appendChild(el('line', {
        class: 'divider',
        x1: dividerX.toFixed(1), y1: 0,
        x2: dividerX.toFixed(1), y2: VBH
    }));

    svg.appendChild(root);

    // widen the viewBox slightly so escaping particles/sparks drifting past
    // VBW remain visible rather than clipped by the SVG's own bounds
    svg.setAttribute('viewBox', `0 0 ${VBW * 1.08} ${VBH}`);
})();
</script>
</body>
</html>
