<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravitational Inversion — Three Phases of Recursive AI Improvement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rubik', sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 16px 20px 14px;
            user-select: none;
            overflow: hidden;
        }

        #fig-wrap { width: 100%; }

        #orbit-canvas {
            display: block;
            width: 100%;
        }

        .fig-source {
            font-size: 0.63rem;
            color: rgba(255,255,255,0.22);
            margin-top: 8px;
            letter-spacing: 0.1px;
        }
        .fig-source a { color: rgba(255,255,255,0.3); text-decoration: none; }
    </style>
</head>
<body>
<div id="fig-wrap">
    <canvas id="orbit-canvas"></canvas>
    <div class="fig-source">
        Figure 1. Researchers envision a three-phase progression in which AI shifts from orbiting human oversight to becoming the gravitational center of its own improvement.
        &nbsp;·&nbsp; <a href="https://arxiv.org/abs/2603.03338" target="_blank">arxiv:2603.03338</a>
    </div>
</div>

<script>
// ─── PHASE DATA ───────────────────────────────────────────────────────────────
const PHASES = [
    {
        label: "Phase 1",
        name: "Research Speedup Tool",
        humanR: 0.155,
        aiR: 0.052,
        orbitR: 0.32,
        orbitSpeed: 1.4,
        humanColor: '#7eb8d4',
        aiColor: '#ff6b6b',
        starIsHuman: true,
        binary: false,
    },
    {
        label: "Phase 2",
        name: "Collaborator",
        humanR: 0.10,
        aiR: 0.095,
        orbitR: 0.22,
        orbitSpeed: 0.75,
        humanColor: '#7eb8d4',
        aiColor: '#ff6b6b',
        starIsHuman: false,
        binary: true,
    },
    {
        label: "Phase 3",
        name: "Full Automation",
        humanR: 0.048,
        aiR: 0.165,
        orbitR: 0.34,
        orbitSpeed: 0.55,
        humanColor: '#7eb8d4',
        aiColor: '#ff6b6b',
        starIsHuman: false,
        binary: false,
    },
];

// ─── CANVAS SETUP ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('orbit-canvas');
const ctx = canvas.getContext('2d');

let W, H, dpr, panelW, isMobile;
let animId;
let startT = null;

function resize() {
    dpr = window.devicePixelRatio || 1;
    const cssW = canvas.parentElement.clientWidth;
    isMobile = cssW < 500;

    const cssH = isMobile
        ? Math.round(cssW * 1.35)
        : Math.min(Math.round(cssW * 0.40), 360);

    W = cssW * dpr;
    H = cssH * dpr;
    canvas.width = W;
    canvas.height = H;
    canvas.style.height = cssH + 'px';

    panelW = isMobile ? W : W / 3;
}

// ─── DRAWING HELPERS ──────────────────────────────────────────────────────────

function drawBody(x, y, r, color) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
}

function drawOrbit(cx, cy, r) {
    ctx.save();
    ctx.globalAlpha = 0.09;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 0.8 * dpr;
    ctx.setLineDash([3 * dpr, 5 * dpr]);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

// ─── PANEL RENDERING ──────────────────────────────────────────────────────────

function getPanelBounds(i) {
    if (isMobile) {
        const ph = H / 3;
        return { x: 0, y: ph * i, w: W, h: ph };
    }
    return { x: panelW * i, y: 0, w: panelW, h: H };
}

function drawPanel(i, t) {
    const phase = PHASES[i];
    const b = getPanelBounds(i);
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;

    ctx.save();
    ctx.beginPath();
    ctx.rect(b.x, b.y, b.w, b.h);
    ctx.clip();

    const halfMin = Math.min(b.w, b.h) / 2;
    const orbitR  = halfMin * phase.orbitR;
    const humanR  = halfMin * phase.humanR;
    const aiR     = halfMin * phase.aiR;
    const angle   = t * phase.orbitSpeed;

    if (phase.binary) {
        const hx = cx + Math.cos(angle)           * orbitR;
        const hy = cy + Math.sin(angle)           * orbitR;
        const ax = cx + Math.cos(angle + Math.PI) * orbitR;
        const ay = cy + Math.sin(angle + Math.PI) * orbitR;

        drawOrbit(cx, cy, orbitR);

        ctx.save();
        ctx.globalAlpha = 0.07;
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 0.6 * dpr;
        ctx.setLineDash([2*dpr, 4*dpr]);
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(ax, ay);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        drawBody(hx, hy, humanR * dpr, phase.humanColor);
        drawBody(ax, ay, aiR    * dpr, phase.aiColor);
        drawBodyLabel(hx, hy - humanR * dpr - 8 * dpr, 'Human', phase.humanColor);
        drawBodyLabel(ax, ay - aiR    * dpr - 8 * dpr, 'AI',    phase.aiColor);

    } else if (phase.starIsHuman) {
        const ax = cx + Math.cos(angle) * orbitR;
        const ay = cy + Math.sin(angle) * orbitR;

        drawOrbit(cx, cy, orbitR);
        drawBody(cx, cy, humanR * dpr, phase.humanColor);
        drawBody(ax, ay, aiR    * dpr, phase.aiColor);
        drawBodyLabel(cx, cy - humanR * dpr - 10 * dpr, 'Human', phase.humanColor);
        drawBodyLabel(ax, ay - aiR * dpr - 8 * dpr,    'AI',    phase.aiColor);

    } else {
        const hx = cx + Math.cos(angle) * orbitR;
        const hy = cy + Math.sin(angle) * orbitR;

        drawOrbit(cx, cy, orbitR);
        drawBody(cx, cy, aiR    * dpr, phase.aiColor);
        drawBody(hx, hy, humanR * dpr, phase.humanColor);
        drawBodyLabel(cx, cy - aiR * dpr - 10 * dpr,    'AI',    phase.aiColor);
        drawBodyLabel(hx, hy - humanR * dpr - 8 * dpr, 'Human', phase.humanColor);
    }

    // Phase label
    const labelY = b.y + b.h - 28 * dpr;

    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.round(7.5 * dpr)}px Rubik, sans-serif`;
    ctx.letterSpacing = `${1.1 * dpr}px`;
    ctx.textAlign = 'center';
    ctx.fillText(phase.label.toUpperCase(), cx, labelY);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = '#fff';
    ctx.font = `500 ${Math.round(9 * dpr)}px Rubik, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(phase.name, cx, labelY + 14 * dpr);
    ctx.restore();

    ctx.restore();
}

function drawBodyLabel(x, y, text, color) {
    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = color;
    ctx.font = `${Math.round(8.5 * dpr)}px Rubik, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(text, x, y);
    ctx.restore();
}

// ─── PANEL DIVIDERS ───────────────────────────────────────────────────────────
function drawDividers() {
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1 * dpr;
    [1, 2].forEach(i => {
        ctx.beginPath();
        if (isMobile) {
            const y = (H / 3) * i;
            ctx.moveTo(0, y); ctx.lineTo(W, y);
        } else {
            const x = panelW * i;
            ctx.moveTo(x, 0); ctx.lineTo(x, H);
        }
        ctx.stroke();
    });
    ctx.restore();
}

// ─── ANIMATION LOOP ───────────────────────────────────────────────────────────
function animate(ts) {
    if (startT === null) startT = ts;
    const t = (ts - startT) / 1000;

    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < 3; i++) drawPanel(i, t);
    drawDividers();

    animId = requestAnimationFrame(animate);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function start() {
    if (animId) cancelAnimationFrame(animId);
    resize();
    startT = null;
    animId = requestAnimationFrame(animate);
}

let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(start, 80);
});

if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start);
} else {
    start();
}
</script>
</body>
</html>
